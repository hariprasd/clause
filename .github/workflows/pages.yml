# Serves the bookmarklet copy of capture.js on GitHub Pages.
# The extension is distributed as a zip from Releases; Pages only hosts the no-install door.
name: Pages

on:
  push:
    branches: [main]
    paths: ["packages/capture/capture.js", "packages/capture/*.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage the bookmarklet host
        run: node scripts/stage-bookmarklet.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - id: deployment
        uses: actions/deploy-pages@v5
